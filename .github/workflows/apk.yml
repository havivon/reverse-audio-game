name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange
      - name: Build
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: achoranit-apk
          path: dist/achoranit.apk
